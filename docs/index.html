<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FHC · Financial Health Check</title>
<meta name="description" content="เช็กสุขภาพการเงินฟรีใน 1 นาที ได้คะแนนเต็ม 100 พร้อมแผนดูแลการเงิน">
<meta property="og:title" content="FHC · Financial Health Check">
<meta property="og:description" content="เช็กสุขภาพการเงินฟรีใน 1 นาที ได้คะแนนเต็ม 100 พร้อมสิ่งที่ควรทำก่อน">
<meta property="og:image" content="https://satienpongkham-art.github.io/content-hq/og.png">
<meta property="og:url" content="https://satienpongkham-art.github.io/content-hq/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#fff4ee">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap">
<style>
/* Layout: one soft card at a time (max 560px). Intro → quick wizard (tap-only, auto-advance) → result cards.
   Detail mode = one grouped number form. Deliberately single light pastel world. Font: Mali throughout. */
:root {
  --cream: #fff4ee;
  --paper: #ffffff;
  --ink: #3e2a3f;
  --muted: #86707f;
  --line: #f1dfe3;
  --pink: #ff7fa8;
  --pink-deep: #e2557f;
  --pink-soft: #ffe4ec;
  --mint: #3fbf9c;
  --mint-soft: #dbf6ed;
  --lav: #9f88ff;
  --lav-soft: #eee8ff;
  --butter-soft: #fff3cf;
  --butter-ink: #8d6200;
  --line-green: #06c755;
  --font: "Mali", "IBM Plex Sans Thai Looped", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--cream);
  background-image:
    radial-gradient(circle at 10% 6%, rgba(255, 127, 168, .22), transparent 32%),
    radial-gradient(circle at 94% 16%, rgba(159, 136, 255, .2), transparent 30%),
    radial-gradient(circle at 70% 98%, rgba(63, 191, 156, .18), transparent 34%),
    radial-gradient(rgba(226, 85, 127, .08) 1.2px, transparent 1.4px);
  background-size: auto, auto, auto, 22px 22px;
  background-attachment: fixed;
  color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-weight: 600; line-height: 1.35; margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lav); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: calc(22px + env(safe-area-inset-top, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)); }

.hdr { text-align: center; display: grid; gap: 6px; justify-items: center; margin-bottom: 22px; }
.sticker { display: inline-block; font-size: 13px; font-weight: 500; padding: 3px 14px; border-radius: 999px; background: var(--butter-soft); color: var(--butter-ink); border: 2px dashed #ffd97a; transform: rotate(-2deg); }
.hdr h1 { font-size: clamp(28px, 7.5vw, 38px); font-weight: 700; }
.hdr h1 span { color: var(--pink-deep); }
.hdr p { color: var(--muted); }

.card { background: var(--paper); border-radius: 28px; padding: 24px 22px; border: 2px solid var(--line); box-shadow: 0 10px 0 -4px var(--pink-soft), 0 24px 40px -30px rgba(226, 85, 127, .5); display: grid; gap: 16px; }
.pop { animation: pop .38s cubic-bezier(.3, 1.4, .5, 1) both; }
@keyframes pop { from { opacity: .001; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }

.modes { display: grid; gap: 12px; }
.mode { text-align: left; border: 2px solid var(--line); background: var(--paper); border-radius: 22px; padding: 16px 18px; cursor: pointer; display: grid; gap: 2px; transition: transform .15s, border-color .15s, box-shadow .15s; }
.mode:hover { transform: translateY(-2px); border-color: var(--pink); }
.mode b { font-size: 19px; font-weight: 600; }
.mode span { color: var(--muted); font-size: 14px; }
.mode.main { background: var(--pink-soft); border-color: var(--pink); box-shadow: 0 6px 0 -2px #ffc3d4; }
.mode.main b { color: var(--pink-deep); }
.badge { justify-self: start; font-size: 12px !important; font-weight: 600; color: #fff !important; background: var(--pink); border-radius: 99px; padding: 0 10px; margin-bottom: 4px; }
.trust { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.trust span::before { content: "✓ "; color: var(--mint); font-weight: 700; }

.wz { display: grid; gap: 14px; }
.wz-top { display: grid; gap: 8px; }
.wz-count { font-size: 13px; color: var(--muted); text-align: center; }
.wz-bar { height: 10px; border-radius: 99px; background: var(--paper); border: 2px solid var(--line); overflow: hidden; }
.wz-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--pink), var(--lav), var(--mint)); transition: width .35s cubic-bezier(.3, .8, .3, 1); }
.wz-card { background: var(--paper); border-radius: 28px; padding: 26px 20px 22px; border: 2px solid var(--line); box-shadow: 0 10px 0 -4px var(--pink-soft); display: grid; gap: 14px; animation: pop .35s cubic-bezier(.3, 1.4, .5, 1) both; }
.wz-q { font-size: 22px; font-weight: 600; text-align: center; line-height: 1.4; }
.wz-hint { color: var(--muted); font-size: 14px; text-align: center; margin-top: -8px; }
.wz-opts { display: grid; gap: 10px; }
.wz-opt { border: 2px solid var(--line); background: #fffafb; border-radius: 18px; padding: 12px 16px; cursor: pointer; font-size: 17px; font-weight: 500; text-align: center; display: grid; transition: transform .12s, border-color .12s, background .12s; }
.wz-opt small { font-size: 13px; color: var(--muted); font-weight: 400; }
.wz-opt:hover { border-color: var(--pink); transform: translateY(-1px); }
.wz-opt[aria-pressed="true"] { background: var(--pink); border-color: var(--pink); color: #fff; }
.wz-opt[aria-pressed="true"] small { color: #fff; }
.wz-nav { display: flex; justify-content: space-between; gap: 10px; }
.wz-back, .wz-detail { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 6px 4px; text-decoration: underline; text-decoration-color: #e7cbd3; text-underline-offset: 4px; }
.wz-back:hover, .wz-detail:hover { color: var(--pink-deep); }
.wz-field { display: grid; gap: 6px; font-weight: 500; }
.wz-field input { border: 2px solid var(--line); border-radius: 16px; background: #fffafb; padding: 12px 16px; outline: 0; font-weight: 400; }
.wz-field input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px var(--pink-soft); }
.wz-consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); background: var(--mint-soft); padding: 12px 14px; border-radius: 16px; }
.wz-consent input { width: 20px; height: 20px; accent-color: var(--mint); margin-top: 3px; flex: none; }
.wz-err { color: var(--pink-deep); font-size: 14px; text-align: center; }
.wz-go, .btn { border: 0; border-radius: 999px; padding: 13px 28px; font-size: 18px; font-weight: 600; cursor: pointer; background: var(--pink); color: #fff; box-shadow: 0 5px 0 var(--pink-deep); transition: transform .12s, box-shadow .12s; justify-self: center; }
.wz-go:active, .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pink-deep); }
.btn-soft { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 10px 20px; cursor: pointer; color: var(--muted); font-weight: 500; }
.btn-soft:hover { border-color: var(--lav); color: var(--ink); }

.fhc-form { display: grid; gap: 14px; }
.fhc-set { background: var(--paper); border: 2px solid var(--line); border-radius: 24px; padding: 14px 18px 18px; margin: 0; min-width: 0; }
.fhc-set legend { font-weight: 600; padding: 0 8px; color: var(--pink-deep); }
.fhc-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); align-items: start; }
.fhc-field { display: grid; gap: 4px; font-size: 14px; min-width: 0; }
.fhc-field > span { color: var(--muted); }
.fhc-field input, .fhc-field select, .fhc-field textarea { width: 100%; border: 2px solid var(--line); border-radius: 14px; background: #fffafb; padding: 10px 12px; outline: 0; font-size: 16px; }
.fhc-field input:focus, .fhc-field select:focus, .fhc-field textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 4px var(--pink-soft); }
.fhc-hint { color: var(--muted); font-size: 12px; }
.fhc-check, .fhc-consent { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.fhc-consent { background: var(--mint-soft); padding: 12px 14px; border-radius: 16px; color: var(--muted); }
.fhc-check input, .fhc-consent input { width: 20px; height: 20px; accent-color: var(--mint); margin-top: 3px; flex: none; }
.fhc-debts { display: grid; gap: 10px; margin-bottom: 10px; }
.fhc-debt { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; align-items: end; padding-bottom: 12px; border-bottom: 2px dashed var(--line); }
.fhc-x { width: 38px; height: 42px; border: 0; background: var(--pink-soft); border-radius: 14px; cursor: pointer; color: var(--pink-deep); font-size: 18px; justify-self: end; }
.fhc-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.fhc-btn { border: 0; border-radius: 999px; padding: 12px 26px; font-size: 17px; font-weight: 600; cursor: pointer; background: var(--pink); color: #fff; box-shadow: 0 5px 0 var(--pink-deep); }
.fhc-btn-ghost { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 9px 18px; cursor: pointer; color: var(--muted); }
.fhc-err { color: var(--pink-deep); font-size: 14px; text-align: center; }

.res { display: grid; gap: 18px; }
.score-card { text-align: center; justify-items: center; }
.ring { position: relative; width: 190px; height: 190px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .in { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; line-height: 1.1; }
.ring b { font-weight: 700; font-size: 56px; }
.ring small { color: var(--muted); }
.level { font-size: 18px; font-weight: 600; padding: 4px 18px; border-radius: 999px; transform: rotate(-2deg); display: inline-block; }
.lv-good { background: var(--mint-soft); color: #1d8a6c; } .lv-ok { background: var(--lav-soft); color: #6450d0; }
.lv-warn { background: var(--butter-soft); color: var(--butter-ink); } .lv-bad { background: var(--pink-soft); color: var(--pink-deep); }
.est { font-size: 13px; color: var(--muted); background: var(--cream); border-radius: 14px; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 6px 10px; justify-content: center; align-items: center; }
.radar { max-width: 360px; margin: 0 auto; width: 100%; }
.radar polygon:not(:last-of-type), .radar line { stroke: #dcbccb; }
.radar polygon:last-of-type { fill: var(--pink); stroke: var(--pink-deep); }
.radar circle { fill: var(--lav); }
.radar text { fill: var(--muted); font-family: var(--font); }
.metrics { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); }
.metric { border-radius: 20px; padding: 12px 16px; display: grid; }
.metric.good { background: var(--mint-soft); } .metric.warn { background: var(--butter-soft); } .metric.bad { background: var(--pink-soft); }
.metric .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.metric .v { font-size: 22px; font-weight: 600; }
.metric small { color: var(--muted); font-size: 12px; }
.tag { font-size: 12px; padding: 0 10px; border-radius: 99px; background: rgba(255, 255, 255, .8); white-space: nowrap; align-self: center; }
.todo { display: grid; gap: 10px; }
.todo div { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 18px; background: var(--cream); }
.todo .n { width: 28px; height: 28px; border-radius: 10px; background: var(--pink); color: #fff; display: grid; place-items: center; font-weight: 600; flex: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 16px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--pink-soft); border-color: var(--pink); color: var(--pink-deep); font-weight: 600; }
.plan-list { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.send-card { background: linear-gradient(165deg, #eafff3, #f7fffb); border-color: #c9f0da; box-shadow: 0 10px 0 -4px #d6f5e4; }
.send-card .txt { width: 100%; border: 2px solid #c9f0da; border-radius: 16px; background: #fff; padding: 12px 16px; outline: 0; }
.send-card .txt:focus { border-color: var(--mint); box-shadow: 0 0 0 4px var(--mint-soft); }
.btn-send { border: 0; border-radius: 999px; padding: 13px 24px; font-size: 18px; font-weight: 600; cursor: pointer; background: var(--mint); color: #fff; box-shadow: 0 5px 0 #2a9c7d; width: 100%; }
.btn-send:active { transform: translateY(4px); box-shadow: 0 1px 0 #2a9c7d; }
.btn-line { border: 0; border-radius: 999px; padding: 13px 24px; font-size: 18px; font-weight: 600; cursor: pointer; background: var(--line-green); color: #fff; box-shadow: 0 5px 0 #04a446; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; }
.btn-line:active { transform: translateY(4px); box-shadow: 0 1px 0 #04a446; }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.or::before, .or::after { content: ""; flex: 1; height: 2px; background: #d6f5e4; }
.lineid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.lineid b { color: var(--ink); user-select: all; }
.mini { border: 2px solid #c9f0da; background: #fff; border-radius: 99px; padding: 2px 12px; cursor: pointer; font-size: 13px; color: var(--ink); text-decoration: none; }
.sent { text-align: center; color: #1d8a6c; font-weight: 600; background: var(--mint-soft); border-radius: 16px; padding: 12px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.brand { font-size: 13px; font-weight: 600; letter-spacing: .06em; color: var(--pink-deep); display: block; margin-bottom: 8px; }
.foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; display: grid; gap: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); opacity: 0; background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 99px; font-size: 14px; transition: all .25s; pointer-events: none; z-index: 9; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <span class="brand">FHC · Financial Health Check</span>
    <span class="sticker">ฟรี · ใช้เวลาแค่ 1 นาที</span>
    <h1>เช็กสุขภาพ<span>การเงิน</span></h1>
    <p>รู้คะแนนการเงินเต็ม 100 และสิ่งที่ควรทำก่อน</p>
  </header>
  <main id="stage"></main>
  <footer class="foot" id="foot"></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Financial Health Check — shared core (calculation + form UI)
 * ใช้ร่วมกันทั้งหน้า HQ (claude.ai) และหน้าสาธารณะ (GitHub Pages)
 * ไม่มีการส่งข้อมูลออกจากเครื่อง: ทุกอย่างคำนวณใน browser
 */
(function (global) {
  "use strict";

  const DEBT_TYPES = [
    { v: "home", t: "บ้าน/คอนโด", consumer: false },
    { v: "car", t: "รถยนต์", consumer: false },
    { v: "card", t: "บัตรเครดิต", consumer: true },
    { v: "personal", t: "สินเชื่อส่วนบุคคล/บัตรกดเงินสด", consumer: true },
    { v: "installment", t: "ผ่อนสินค้า 0%/ผ่อนของ", consumer: true },
    { v: "business", t: "หนี้ธุรกิจ", consumer: false },
    { v: "other", t: "อื่น ๆ", consumer: true },
  ];

  const WELFARE = [
    { v: "none", t: "ไม่มีสวัสดิการรักษา" },
    { v: "basic", t: "ประกันสังคม / บัตรทอง" },
    { v: "gov", t: "สวัสดิการข้าราชการ / รัฐวิสาหกิจ" },
    { v: "corp", t: "ประกันกลุ่มจากบริษัท" },
  ];

  const n = (x) => {
    const v = parseFloat(String(x ?? "").replace(/,/g, ""));
    return isFinite(v) && v > 0 ? v : 0;
  };

  /** คำนวณผลจากข้อมูลดิบ คืนค่า {metrics, score, level, risks, plan, gap} */
  function calculate(input) {
    const d = input || {};
    const income = n(d.income);
    const expense = n(d.expense);
    const saving = n(d.saving);
    const liquid = n(d.liquid);
    const invest = n(d.invest);
    const otherAssets = n(d.otherAssets);
    const lifeCover = n(d.lifeCover);
    const healthLimit = n(d.healthLimit);
    const ciCover = n(d.ciCover);
    const dependents = Math.round(n(d.dependents));
    const freelance = !!d.freelance;
    const debts = (d.debts || []).map((x) => ({
      type: x.type || "other",
      balance: n(x.balance),
      payment: n(x.payment),
      rate: n(x.rate),
    }));

    const debtTotal = debts.reduce((s, x) => s + x.balance, 0);
    const payTotal = debts.reduce((s, x) => s + x.payment, 0);
    const consumerPay = debts
      .filter((x) => (DEBT_TYPES.find((t) => t.v === x.type) || {}).consumer)
      .reduce((s, x) => s + x.payment, 0);
    const assets = liquid + invest + otherAssets;
    const netWorth = assets - debtTotal;

    const efTarget = freelance ? 6 : 3;
    const efMonths = expense > 0 ? liquid / expense : liquid > 0 ? 99 : 0;
    const dsr = income > 0 ? payTotal / income : payTotal > 0 ? 1 : 0;
    const consumerRatio = income > 0 ? consumerPay / income : consumerPay > 0 ? 1 : 0;
    const savingRatio = income > 0 ? saving / income : 0;
    const debtToAsset = assets > 0 ? debtTotal / assets : debtTotal > 0 ? 9 : 0;
    const cashflow = income - expense - payTotal - saving;

    // ทุนประกันชีวิตที่ควรมี (Need-based แบบย่อ)
    const lifeNeed =
      debtTotal +
      (dependents > 0 ? expense * 12 * Math.min(10, 3 + dependents * 2) : 0) +
      (dependents > 0 || debtTotal > 0 ? 100000 : 0);
    const lifeRatio = lifeNeed > 0 ? lifeCover / lifeNeed : 1;
    const welfare = d.welfare || "none";

    // ---------- คะแนน (รวม 100) ----------
    const sEF =
      efMonths >= efTarget * 2 ? 20 : efMonths >= efTarget ? 16 : efMonths >= efTarget / 2 ? 9 : efMonths >= 0.5 ? 4 : 0;
    const sDSR = dsr <= 0.25 ? 20 : dsr <= 0.35 ? 15 : dsr <= 0.45 ? 8 : dsr <= 0.6 ? 3 : 0;
    const sCons = consumerRatio <= 0.1 ? 10 : consumerRatio <= 0.2 ? 6 : consumerRatio <= 0.3 ? 2 : 0;
    const sSave = savingRatio >= 0.2 ? 15 : savingRatio >= 0.1 ? 11 : savingRatio >= 0.05 ? 6 : savingRatio > 0 ? 2 : 0;
    const sDA = debtToAsset <= 0.3 ? 10 : debtToAsset <= 0.5 ? 7 : debtToAsset <= 0.8 ? 3 : 0;
    const sLife = Math.round(Math.min(1, lifeRatio) * 15);
    const welfareBase = welfare === "gov" ? 6 : welfare === "corp" ? 4 : welfare === "basic" ? 3 : 0;
    const sHealth = Math.min(
      10,
      healthLimit >= 1000000 ? 10 : healthLimit >= 500000 ? 7 + (ciCover > 0 ? 1 : 0) : healthLimit > 0 ? 4 + (ciCover > 0 ? 1 : 0) : welfareBase + (ciCover > 0 ? 2 : 0)
    );
    const score = sEF + sDSR + sCons + sSave + sDA + sLife + sHealth;
    const level =
      score >= 80 ? { key: "good", t: "แข็งแรง" } : score >= 60 ? { key: "ok", t: "พอใช้" } : score >= 40 ? { key: "warn", t: "ต้องดูแล" } : { key: "bad", t: "วิกฤต" };

    const st = (got, max) => (got >= max * 0.75 ? "good" : got >= max * 0.4 ? "warn" : "bad");
    const pct = (v) => (v * 100).toFixed(0) + "%";
    const metrics = [
      { id: "ef", short: "สำรองฉุกเฉิน", name: "เงินสำรองฉุกเฉิน", value: efMonths >= 99 ? "—" : efMonths.toFixed(1) + " เดือน", target: `${efTarget}–${efTarget * 2} เดือน`, formula: "สินทรัพย์สภาพคล่อง ÷ ค่าใช้จ่ายต่อเดือน", score: sEF, max: 20, status: st(sEF, 20) },
      { id: "dsr", short: "หนี้/รายได้", name: "ภาระหนี้ต่อรายได้ (DSR)", value: pct(dsr), target: "ไม่เกิน 35–40%", formula: "ค่างวดหนี้ทั้งหมด ÷ รายได้", score: sDSR, max: 20, status: st(sDSR, 20) },
      { id: "cons", short: "หนี้บริโภค", name: "หนี้บริโภคต่อรายได้", value: pct(consumerRatio), target: "ไม่เกิน 15–20%", formula: "ค่างวดบัตร/สินเชื่อส่วนบุคคล/ผ่อนของ ÷ รายได้", score: sCons, max: 10, status: st(sCons, 10) },
      { id: "save", short: "การออม", name: "อัตราการออมและลงทุน", value: pct(savingRatio), target: "10–20% ขึ้นไป", formula: "เงินออม+ลงทุนต่อเดือน ÷ รายได้", score: sSave, max: 15, status: st(sSave, 15) },
      { id: "da", short: "หนี้/ทรัพย์สิน", name: "หนี้สินต่อทรัพย์สิน", value: assets > 0 ? pct(debtToAsset) : debtTotal > 0 ? "ไม่มีทรัพย์สิน" : "0%", target: "ต่ำกว่า 50%", formula: "หนี้สินรวม ÷ ทรัพย์สินรวม", score: sDA, max: 10, status: st(sDA, 10) },
      { id: "life", short: "ประกันชีวิต", name: "ความคุ้มครองชีวิต", value: lifeNeed > 0 ? pct(Math.min(lifeRatio, 9.99)) + " ของที่ควรมี" : "ยังไม่มีภาระที่ต้องคุ้มครอง", target: lifeNeed > 0 ? "ทุนอย่างน้อย " + fmt(lifeNeed) + " บาท" : "—", formula: "ทุนประกันชีวิต ÷ (หนี้ + ค่าใช้จ่ายผู้ที่ต้องดูแล + ค่าใช้จ่ายสุดท้าย)", score: sLife, max: 15, status: st(sLife, 15) },
      { id: "health", short: "สุขภาพ", name: "ความคุ้มครองสุขภาพ", value: healthLimit > 0 ? fmt(healthLimit) + " บาท/ปี" : (WELFARE.find((w) => w.v === welfare) || {}).t, target: "ผู้ป่วยใน 1 ล้านบาท/ปีขึ้นไป + โรคร้ายแรง", formula: "วงเงินค่ารักษาเทียบค่ารักษาโรงพยาบาลเอกชนปัจจุบัน", score: sHealth, max: 10, status: st(sHealth, 10) },
    ];

    // ---------- จุดเสี่ยง ----------
    const risks = [];
    if (cashflow < 0) risks.push({ w: 100, t: `กระแสเงินสดติดลบ ${fmt(-cashflow)} บาท/เดือน (รายจ่าย+หนี้+ออม มากกว่ารายได้)` });
    if (efMonths < efTarget) risks.push({ w: 90 - efMonths * 10, t: `เงินสำรองมีแค่ ${efMonths.toFixed(1)} เดือน ถ้ารายได้หยุดจะอยู่ได้ไม่ถึง ${efTarget} เดือน` });
    if (dsr > 0.4) risks.push({ w: 80 + dsr * 20, t: `ค่างวดหนี้กินรายได้ ${pct(dsr)} สูงเกินเกณฑ์ 40%` });
    const highRate = debts.filter((x) => x.rate >= 15 && x.balance > 0);
    if (highRate.length) risks.push({ w: 75, t: `มีหนี้ดอกเบี้ยสูง (≥15%/ปี) ${highRate.length} ก้อน รวม ${fmt(highRate.reduce((s, x) => s + x.balance, 0))} บาท` });
    if (lifeNeed > 0 && lifeRatio < 0.6) risks.push({ w: 70, t: `ทุนประกันชีวิตขาดอีกประมาณ ${fmt(lifeNeed - lifeCover)} บาท หากเกิดเหตุไม่คาดฝัน ครอบครัวต้องรับภาระแทน` });
    if (healthLimit < 500000 && welfare !== "gov") risks.push({ w: 65, t: "วงเงินค่ารักษาอาจไม่พอค่ารักษาโรงพยาบาลเอกชนหากป่วยหนัก" });
    if (savingRatio < 0.1) risks.push({ w: 55, t: `ออมได้ ${pct(savingRatio)} ของรายได้ ต่ำกว่าเกณฑ์ 10%` });
    if (netWorth < 0) risks.push({ w: 60, t: `ความมั่งคั่งสุทธิติดลบ ${fmt(-netWorth)} บาท` });
    risks.sort((a, b) => b.w - a.w);

    // ---------- แผน 30/90/365 ----------
    const plan = { d30: [], d90: [], d365: [] };
    plan.d30.push("จดรายรับรายจ่ายทุกวัน 30 วัน เพื่อหาจุดรั่ว");
    if (cashflow < 0) plan.d30.push(`ตัดค่าใช้จ่ายไม่จำเป็นอย่างน้อย ${fmt(-cashflow)} บาท/เดือน ให้กระแสเงินสดกลับมาเป็นบวก`);
    if (efMonths < efTarget) plan.d30.push(`แยกบัญชีเงินสำรองฉุกเฉิน ตั้งโอนอัตโนมัติวันเงินเดือนออก (เป้าหมาย ${fmt(expense * efTarget)} บาท)`);
    if (highRate.length) plan.d30.push("หยุดก่อหนี้บริโภคใหม่ และจ่ายหนี้ดอกเบี้ยสูงมากกว่าขั้นต่ำ");
    if (debts.length > 1) plan.d90.push("เรียงหนี้ตามดอกเบี้ย (Avalanche) หรือยอดน้อยสุด (Snowball) แล้วโปะทีละก้อน");
    if (dsr > 0.4) plan.d90.push("ติดต่อเจ้าหนี้เรื่องปรับโครงสร้าง/รวมหนี้/รีไฟแนนซ์ ให้ค่างวดต่ำกว่า 40% ของรายได้");
    if (healthLimit < 1000000 && welfare !== "gov") plan.d90.push("ทบทวนประกันสุขภาพให้วงเงินผู้ป่วยในเพียงพอ ก่อนอายุและสุขภาพเปลี่ยน");
    if (lifeNeed > 0 && lifeRatio < 1) plan.d90.push(`ปิดช่องว่างทุนประกันชีวิต ${fmt(Math.max(0, lifeNeed - lifeCover))} บาท ด้วยแบบที่เบี้ยเหมาะกับงบ`);
    if (savingRatio < 0.1) plan.d90.push("ตั้งออมก่อนใช้ อย่างน้อย 10% ของรายได้ ทันทีที่เงินเข้า");
    plan.d365.push("เงินสำรองฉุกเฉินครบตามเป้า และเริ่มลงทุนสม่ำเสมอ (DCA) ตามความเสี่ยงที่รับได้");
    plan.d365.push("ใช้สิทธิลดหย่อนภาษีให้ครบ (ประกันชีวิต ประกันสุขภาพ กองทุนลดหย่อนภาษี)");
    plan.d365.push("ทำ Financial Health Check ซ้ำทุก 6–12 เดือน");

    return {
      totals: { income, expense, saving, payTotal, debtTotal, assets, netWorth, cashflow, lifeNeed, lifeCover },
      metrics,
      score,
      level,
      risks: risks.slice(0, 3).map((r) => r.t),
      allRisks: risks.map((r) => r.t),
      plan,
      gap: { life: Math.max(0, lifeNeed - lifeCover), healthOk: healthLimit >= 1000000 || welfare === "gov" },
    };
  }

  function fmt(v) {
    return Math.round(v).toLocaleString("th-TH");
  }

  /** ข้อความสรุปสำหรับส่ง LINE (ไม่ใช้ AI) */
  function lineSummary(input, r, opts) {
    const o = opts || {};
    const L = [];
    L.push(`📋 ผลเช็กสุขภาพการเงิน${input.name ? " ของ " + input.name : ""}`);
    L.push(`คะแนน ${r.score}/100 ระดับ: ${r.level.t}`);
    L.push("");
    r.metrics.forEach((m) => L.push(`${m.status === "good" ? "🟢" : m.status === "warn" ? "🟡" : "🔴"} ${m.name}: ${m.value}`));
    if (r.risks.length) {
      L.push("");
      L.push("⚠️ จุดที่ควรดูแลก่อน");
      r.risks.forEach((t, i) => L.push(`${i + 1}. ${t}`));
    }
    L.push("");
    L.push(o.footer || "ผลประเมินเบื้องต้นเพื่อการศึกษา ไม่ใช่คำแนะนำการลงทุน");
    return L.join("\n");
  }


  /** กราฟเรดาร์ 7 ด้าน (SVG string) opt: {size, grid, stroke, fill, text, dot} */
  function radarSVG(metrics, opt) {
    const o = Object.assign({ size: 300, grid: "currentColor", stroke: "currentColor", fill: "currentColor", text: "currentColor", dot: "currentColor" }, opt || {});
    const S = o.size, cx = S / 2, cy = S / 2, R = S * 0.32, N = metrics.length;
    const pt = (i, r) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / N; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
    let g = "";
    [0.25, 0.5, 0.75, 1].forEach((k) => {
      g += `<polygon points="${metrics.map((_, i) => pt(i, R * k).join(",")).join(" ")}" fill="none" stroke="${o.grid}" stroke-opacity="${k === 1 ? 0.5 : 0.22}" stroke-width="1"/>`;
    });
    metrics.forEach((_, i) => { const [x, y] = pt(i, R); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${o.grid}" stroke-opacity="0.22"/>`; });
    const vals = metrics.map((m, i) => pt(i, R * Math.max(0.04, m.score / m.max)));
    g += `<polygon points="${vals.map((p) => p.join(",")).join(" ")}" fill="${o.fill}" fill-opacity="0.28" stroke="${o.stroke}" stroke-width="2" stroke-linejoin="round"/>`;
    vals.forEach((p) => (g += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${o.dot}"/>`));
    metrics.forEach((m, i) => {
      const [x, y] = pt(i, R + S * 0.1);
      const anchor = Math.abs(x - cx) < 4 ? "middle" : x > cx ? "start" : "end";
      g += `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle" font-size="${S * 0.04}" fill="${o.text}">${m.short}</text>`;
      g += `<text x="${x}" y="${y + S * 0.048}" text-anchor="${anchor}" dominant-baseline="middle" font-size="${S * 0.034}" fill="${o.text}" fill-opacity="0.6">${m.score}/${m.max}</text>`;
    });
    return `<svg viewBox="${-S * 0.12} 0 ${S * 1.24} ${S}" width="100%" role="img" aria-label="กราฟเรดาร์สุขภาพการเงิน 7 ด้าน">${g}</svg>`;
  }

  /** แปลงคำตอบโหมดด่วนเป็นข้อมูลตัวเลขโดยประมาณ */
  function quickToInput(a) {
    const income = a.income || 0;
    const pay = income * (a.debtLoad || 0);
    const consumerPay = pay * (a.debtLoad ? a.consumer || 0 : 0);
    const otherPay = pay - consumerPay;
    const outflow = income * (1 - (a.left ?? 0.1));
    const expense = Math.max(income * 0.2, outflow - pay);
    const debts = [];
    if (consumerPay > 0) debts.push({ type: "card", balance: Math.round(consumerPay * 24), payment: Math.round(consumerPay), rate: 18 });
    if (otherPay > 0) debts.push({ type: "car", balance: Math.round(otherPay * 60), payment: Math.round(otherPay), rate: 5 });
    const h = a.health || "basic";
    return {
      name: a.name || "", age: a.age || 0, dependents: a.dependents || 0, freelance: !!a.freelance,
      income: Math.round(income), expense: Math.round(expense), saving: Math.round(income * (a.save || 0)),
      debts, liquid: Math.round(expense * (a.ef ?? 1)), invest: 0, otherAssets: a.assets || 0,
      lifeCover: a.life || 0,
      healthLimit: h === "own-high" ? 1500000 : h === "own-low" ? 400000 : 0,
      ciCover: 0, welfare: h.startsWith("own") ? "basic" : h,
      goal: a.goal || "", consent: !!a.consent, quick: true,
    };
  }

  /**
   * wizard(el, {mode, onDone(input, answers), consentText, startName})
   * แสดงทีละคำถาม แตะแล้วไปข้อถัดไปอัตโนมัติ
   */
  function wizard(el, opts) {
    const o = opts || {};
    let a = Object.assign({}, o.answers || {});
    const list = () => QUICK.filter((q) => !(q.skipIf && q.skipIf(a)));
    let i = 0;
    const total = () => list().length + 1;
    function frame(inner, idx) {
      const pct = Math.round((idx / total()) * 100);
      return `<div class="wz">
        <div class="wz-top"><span class="wz-count">${idx < total() - 1 ? `ข้อ ${idx + 1} จาก ${total() - 1}` : "ขั้นสุดท้าย"}</span><div class="wz-bar"><i style="width:${pct}%"></i></div></div>
        <div class="wz-card">${inner}</div>
        <div class="wz-nav">${idx > 0 ? '<button type="button" class="wz-back">← ย้อนกลับ</button>' : "<span></span>"}${o.onDetail ? '<button type="button" class="wz-detail">กรอกตัวเลขจริงแทน</button>' : ""}</div>
      </div>`;
    }
    function render() {
      const L = list();
      if (i < L.length) {
        const q = L[i];
        el.innerHTML = frame(`<p class="wz-q">${esc(q.q)}</p>${q.hint ? `<p class="wz-hint">${esc(q.hint)}</p>` : ""}
          <div class="wz-opts">${q.opts.map((op, j) => `<button type="button" class="wz-opt" data-j="${j}" aria-pressed="${a[q.k] !== undefined && a[q.k] === op[1]}"><span>${esc(op[0])}</span>${op[2] ? `<small>${esc(op[2])}</small>` : ""}</button>`).join("")}</div>`, i);
        el.querySelectorAll(".wz-opt").forEach((b) => b.addEventListener("click", () => {
          a[q.k] = q.opts[+b.dataset.j][1];
          el.querySelectorAll(".wz-opt").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
          setTimeout(() => { i++; render(); }, 220);
        }));
      } else {
        el.innerHTML = frame(`<p class="wz-q">เกือบเสร็จแล้ว</p>
          <label class="wz-field" for="wz-name"><span>${o.mode === "owner" ? "ชื่อเล่นลูกค้า" : "อยากให้เรียกว่าอะไร (ไม่บังคับ)"}</span><input id="wz-name" type="text" value="${esc(a.name || "")}" placeholder="เช่น มิว" autocomplete="off"></label>
          <label class="wz-consent" for="wz-consent"><input id="wz-consent" type="checkbox" ${a.consent ? "checked" : ""}><span>${esc(o.consentText || "เข้าใจแล้วว่าเป็นการประเมินเบื้องต้น")}</span></label>
          <p class="wz-err" hidden>ติ๊กช่องด้านบนก่อนดูผลนะ</p>
          <button type="button" class="wz-go">ดูผลเลย</button>`, L.length);
        el.querySelector(".wz-go").addEventListener("click", () => {
          a.name = el.querySelector("#wz-name").value.trim();
          a.consent = el.querySelector("#wz-consent").checked;
          if (!a.consent) { el.querySelector(".wz-err").hidden = false; return; }
          o.onDone && o.onDone(quickToInput(a), a);
        });
      }
      const bk = el.querySelector(".wz-back"); if (bk) bk.addEventListener("click", () => { i = Math.max(0, i - 1); render(); });
      const dt = el.querySelector(".wz-detail"); if (dt) dt.addEventListener("click", () => o.onDetail(quickToInput(a), a));
    }
    render();
    return { reset(ans) { a = Object.assign({}, ans || {}); i = 0; render(); }, get answers() { return a; } };
  }

  // ---------------- UI ----------------
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function field(id, label, opts) {

  function formHTML(mode) {

    <form class="fhc-form" id="fhc-form" novalidate>

          ${field("fhc-dependents", "จำนวนคนที่ต้องดูแล", { ph: "0", hint: "พ่อแม่ ลูก คู่สมรสที่พึ่งพารายได้คุณ" })}
          <label class="fhc-field fhc-check" for="fhc-freelance"><input id="fhc-freelance" name="fhc-freelance" type="checkbox"><span>รายได้ไม่แน่นอน (ฟรีแลนซ์/ค้าขาย/เจ้าของกิจการ)</span></label>
        </div>
      </fieldset>
      <fieldset class="fhc-set"><legend>รายรับ-รายจ่ายต่อเดือน (บาท)</legend>
        <div class="fhc-grid">
          ${field("fhc-income", "รายได้รวมต่อเดือน (หลังหักภาษี/ประกันสังคม)")}
          ${field("fhc-expense", "ค่าใช้จ่ายต่อเดือน (ไม่รวมค่างวดหนี้)", { hint: "ค่ากิน ค่าเดินทาง ค่าเช่า ค่าน้ำไฟ ฯลฯ" })}
          ${field("fhc-saving", "เงินออม+ลงทุนต่อเดือน")}
        </div>
      </fieldset>
      <fieldset class="fhc-set"><legend>หนี้สิน</legend>
        <div class="fhc-debts" id="fhc-debts"></div>
        <button type="button" class="fhc-btn-ghost" id="fhc-add-debt">+ เพิ่มหนี้</button>
      </fieldset>
      <fieldset class="fhc-set"><legend>ทรัพย์สิน (บาท)</legend>
        <div class="fhc-grid">
          ${field("fhc-liquid", "เงินสด/เงินฝาก (ถอนได้ทันที)")}
          ${field("fhc-invest", "เงินลงทุน (หุ้น กองทุน ทอง ฯลฯ)")}
          ${field("fhc-otherAssets", "ทรัพย์สินอื่น (บ้าน รถ ที่ดิน)", { hint: "มูลค่าตลาดโดยประมาณ" })}
        </div>
      </fieldset>
      <fieldset class="fhc-set"><legend>ความคุ้มครองที่มีอยู่</legend>
        <div class="fhc-grid">
          ${field("fhc-lifeCover", "ทุนประกันชีวิตรวม (บาท)")}
          ${field("fhc-healthLimit", "วงเงินค่ารักษาผู้ป่วยใน ต่อปี (บาท)")}
          ${field("fhc-ciCover", "ทุนประกันโรคร้ายแรง (บาท)")}
          <label class="fhc-field" for="fhc-welfare"><span>สวัสดิการรักษาพยาบาล</span>
            <select id="fhc-welfare" name="fhc-welfare">${WELFARE.map((w) => `<option value="${w.v}">${w.t}</option>`).join("")}</select></label>
        </div>
      </fieldset>
      <fieldset class="fhc-set"><legend>เป้าหมายการเงิน</legend>
        <label class="fhc-field" for="fhc-goal"><span>อยากให้การเงินเป็นแบบไหนใน 1–5 ปี</span>
          <textarea id="fhc-goal" name="fhc-goal" rows="2" placeholder="เช่น ปลดหนี้บัตรให้หมด มีเงินสำรอง 6 เดือน ซื้อคอนโด"></textarea></label>
      </fieldset>
      <label class="fhc-consent" for="fhc-consent"><input id="fhc-consent" name="fhc-consent" type="checkbox">
        <span>${owner ? "ลูกค้ายินยอมให้เก็บข้อมูลนี้เพื่อใช้วางแผนการเงิน (PDPA)" : "ฉันเข้าใจว่าผลนี้เป็นการประเมินเบื้องต้น ข้อมูลคำนวณในเครื่องของฉันเท่านั้น ไม่ถูกส่งไปที่ใดจนกว่าฉันจะกดส่งเอง"}</span></label>
      <div class="fhc-actions">
        <button type="submit" class="fhc-btn">ดูผลสุขภาพการเงิน</button>
        <button type="button" class="fhc-btn-ghost" id="fhc-sample">ลองกรอกตัวอย่าง</button>
        <button type="button" class="fhc-btn-ghost" id="fhc-reset">ล้างข้อมูล</button>
      </div>
      <p class="fhc-err" id="fhc-err" role="alert" hidden></p>
    </form>
    <section class="fhc-result" id="fhc-result" hidden aria-live="polite"></section>`;
  }

  function debtRow(i, d) {
    const x = d || {};
    return `<div class="fhc-debt" data-i="${i}">
      <label class="fhc-field" for="fhc-dt-${i}"><span>ประเภท</span><select id="fhc-dt-${i}">${DEBT_TYPES.map((t) => `<option value="${t.v}" ${x.type === t.v ? "selected" : ""}>${t.t}</option>`).join("")}</select></label>
      <label class="fhc-field" for="fhc-db-${i}"><span>ยอดคงเหลือ</span><input id="fhc-db-${i}" type="text" inputmode="decimal" data-num="1" value="${esc(x.balance || "")}" placeholder="0"></label>
      <label class="fhc-field" for="fhc-dp-${i}"><span>ค่างวด/เดือน</span><input id="fhc-dp-${i}" type="text" inputmode="decimal" data-num="1" value="${esc(x.payment || "")}" placeholder="0"></label>
      <label class="fhc-field" for="fhc-dr-${i}"><span>ดอกเบี้ย %/ปี</span><input id="fhc-dr-${i}" type="text" inputmode="decimal" value="${esc(x.rate || "")}" placeholder="0"></label>
      <button type="button" class="fhc-x" aria-label="ลบหนี้รายการนี้" data-del="${i}">×</button>
    </div>`;
  }

  const SAMPLE = {
    name: "ตัวอย่าง: มิว", age: 28, dependents: 1, freelance: false,
    income: 32000, expense: 17000, saving: 2000,
    debts: [ { type: "car", balance: 380000, payment: 8200, rate: 3 }, { type: "card", balance: 45000, payment: 2500, rate: 16 } ],
    liquid: 25000, invest: 15000, otherAssets: 450000,
    lifeCover: 200000, healthLimit: 0, ciCover: 0, welfare: "basic",
    goal: "ปลดหนี้บัตร มีเงินสำรอง 6 เดือน",
  };

  function resultHTML(input, r, mode) {
    const statusT = { good: "ดี", warn: "ควรปรับ", bad: "เสี่ยง" };
    const ring = Math.max(0, Math.min(100, r.score));
    return `
      <div class="fhc-top">
      <div class="fhc-score fhc-lv-${r.level.key}">
        <div class="fhc-gauge" style="--p:${ring}"><div><b>${r.score}</b><span>/100</span></div></div>
        <div class="fhc-score-txt">
          <p class="fhc-eyebrow">คะแนนสุขภาพการเงิน${input.name ? " · " + esc(input.name) : ""}</p>
          <h3>ระดับ: ${r.level.t}</h3>
          <p>กระแสเงินสดคงเหลือ <b class="fhc-num">${fmt(r.totals.cashflow)}</b> บาท/เดือน · ความมั่งคั่งสุทธิ <b class="fhc-num">${fmt(r.totals.netWorth)}</b> บาท</p>
        </div>
      </div>
      <div class="fhc-radar">${radarSVG(r.metrics)}</div>
      </div>
      <div class="fhc-table-wrap"><table class="fhc-table">
        <thead><tr><th>ด้าน</th><th>ผลของคุณ</th><th>เกณฑ์</th><th>คะแนน</th></tr></thead>
        <tbody>${r.metrics.map((m) => `<tr><td><span class="fhc-pill fhc-${m.status}">${statusT[m.status]}</span> ${esc(m.name)}<small>${esc(m.formula)}</small></td><td class="fhc-num">${esc(m.value)}</td><td>${esc(m.target)}</td><td class="fhc-num">${m.score}/${m.max}</td></tr>`).join("")}</tbody>
      </table></div>
      ${r.risks.length ? `<div class="fhc-block"><h4>3 จุดที่ควรดูแลก่อน</h4><ol>${r.risks.map((t) => `<li>${esc(t)}</li>`).join("")}</ol></div>` : `<div class="fhc-block"><h4>ไม่พบจุดเสี่ยงสำคัญ</h4><p>รักษาวินัยนี้ไว้ และทบทวนทุก 6–12 เดือน</p></div>`}
      <div class="fhc-plan">
        <div><h4>30 วัน</h4><ul>${r.plan.d30.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>
        <div><h4>90 วัน</h4><ul>${r.plan.d90.map((t) => `<li>${esc(t)}</li>`).join("") || "<li>รักษาแผนเดิม</li>"}</ul></div>
        <div><h4>1 ปี</h4><ul>${r.plan.d365.map((t) => `<li>${esc(t)}</li>`).join("")}</ul></div>
      </div>
      <p class="fhc-disclaimer">ผลประเมินเบื้องต้นเพื่อการศึกษา ใช้เกณฑ์ทั่วไป ไม่ใช่คำแนะนำการลงทุน ควรปรึกษาผู้เชี่ยวชาญก่อนตัดสินใจ</p>
      <div class="fhc-actions" id="fhc-result-actions"></div>`;
  }

  /**
   * mount(el, {mode:"owner"|"public", onResult(input,result), actions:[{id,label,primary,onClick(input,result,btn)}], initial})
   */
  function mount(el, opts) {
    const o = opts || {};
    el.innerHTML = formHTML(o.mode);
    const form = el.querySelector("#fhc-form");
    const debtsEl = el.querySelector("#fhc-debts");
    const resEl = el.querySelector("#fhc-result");
    const errEl = el.querySelector("#fhc-err");
    let debtCount = 0;
    let last = null;

    function addDebt(d) { debtsEl.insertAdjacentHTML("beforeend", debtRow(debtCount++, d)); }
    function setVal(id, v) { const f = el.querySelector("#fhc-" + id); if (!f) return; if (f.type === "checkbox") f.checked = !!v; else f.value = f.dataset.num && n(v) ? n(v).toLocaleString("en-US") : (v ?? ""); }
    function fill(d) {
      ["name", "age", "dependents", "income", "expense", "saving", "liquid", "invest", "otherAssets", "lifeCover", "healthLimit", "ciCover", "goal"].forEach((k) => setVal(k, d[k]));
      setVal("freelance", d.freelance); setVal("welfare", d.welfare || "none"); setVal("consent", d.consent);
      debtsEl.innerHTML = ""; debtCount = 0;
      (d.debts && d.debts.length ? d.debts : [{}]).forEach(addDebt);
    }
    function read() {
      const g = (id) => { const f = el.querySelector("#fhc-" + id); return f ? (f.type === "checkbox" ? f.checked : f.value.trim()) : ""; };
      const debts = [...debtsEl.querySelectorAll(".fhc-debt")].map((row) => {
        const i = row.dataset.i;
        return { type: el.querySelector("#fhc-dt-" + i).value, balance: n(el.querySelector("#fhc-db-" + i).value), payment: n(el.querySelector("#fhc-dp-" + i).value), rate: n(el.querySelector("#fhc-dr-" + i).value) };
      }).filter((x) => x.balance || x.payment);
      const out = { name: g("name"), age: n(g("age")), dependents: n(g("dependents")), freelance: g("freelance"), welfare: g("welfare"), goal: g("goal"), consent: g("consent"), debts };
      ["income", "expense", "saving", "liquid", "invest", "otherAssets", "lifeCover", "healthLimit", "ciCover"].forEach((k) => (out[k] = n(g(k))));
      return out;
    }
    function show(input) {
      const r = calculate(input);
      last = { input, result: r };
      resEl.innerHTML = resultHTML(input, r, o.mode);
      resEl.hidden = false;
      const act = resEl.querySelector("#fhc-result-actions");
      (o.actions || []).forEach((a) => {
        const b = document.createElement("button");
        b.type = "button"; b.className = a.primary ? "fhc-btn" : "fhc-btn-ghost"; b.textContent = a.label; b.id = "fhc-act-" + a.id;
        b.addEventListener("click", () => a.onClick(last.input, last.result, b));
        act.appendChild(b);
      });
      if (o.onResult) o.onResult(input, r, resEl);
      resEl.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
    }

    // format numbers with commas while typing
    el.addEventListener("blur", (e) => {
      const t = e.target;
      if (t && t.dataset && t.dataset.num && t.value) { const v = n(t.value); t.value = v ? v.toLocaleString("en-US") : ""; }
    }, true);
    el.querySelector("#fhc-add-debt").addEventListener("click", () => addDebt());
    debtsEl.addEventListener("click", (e) => { const i = e.target.dataset && e.target.dataset.del; if (i != null) e.target.closest(".fhc-debt").remove(); });
    el.querySelector("#fhc-sample").addEventListener("click", () => fill(SAMPLE));
    el.querySelector("#fhc-reset").addEventListener("click", () => { fill({}); resEl.hidden = true; errEl.hidden = true; });
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const d = read();
      const miss = [];
      if (!d.income) miss.push("รายได้ต่อเดือน");
      if (!d.expense) miss.push("ค่าใช้จ่ายต่อเดือน");
      if (!d.consent) miss.push("ช่องยืนยันด้านล่าง");
      if (miss.length) { errEl.textContent = "กรุณากรอก: " + miss.join(", "); errEl.hidden = false; return; }
      errEl.hidden = true;
      if (o.onSubmit) { o.onSubmit(d); return; }
      show(d);
    });

    fill(o.initial || {});
    return { fill, read, show, get last() { return last; } };
  }

  global.FHC = { calculate, lineSummary, radarSVG, mount, wizard, quickToInput, QUICK, fmt, DEBT_TYPES, WELFARE, SAMPLE };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ===== ตั้งค่าที่ปรึกษา ===== */
const ADVISOR = {
  name: "Satienpong",
  role: "ที่ปรึกษาการเงินและประกันชีวิต",

  lineAdd: "https://line.me/ti/p/~superzerrrr",
};
/* ========================== */
(function () {
  "use strict";
  const $ = (s, r) => (r || document).querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const API = "https://script.google.com/macros/s/AKfycbxOSY_YQXOQ5crGogdm68_IdH-wnbw6AyX-fvTdbsAZI8bf0loixvYYk0mWztXpTodW/exec";
  const GAS = !!API;
  const stage = $("#stage");
  let quickAnswers = {};

  let toastT;
  function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1900); }
  async function copy(text, ok) {
    try { await navigator.clipboard.writeText(text); toast(ok || "คัดลอกแล้ว"); }
    catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(ok || "คัดลอกแล้ว"); } catch (_) { toast("คัดลอกไม่ได้"); } ta.remove(); }
  }
  const top = () => window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  $("#foot").innerHTML = `<span>${esc(ADVISOR.name)} · ${esc(ADVISOR.role)} · LINE ${esc(ADVISOR.lineId)}</span><span>ผลประเมินเบื้องต้นด้วยเกณฑ์ทั่วไป ไม่ใช่คำแนะนำการลงทุน</span>`;

  function intro() {
    stage.innerHTML = `<section class="card pop">
      <div class="modes">
        <button type="button" class="mode main" id="m-quick"><span class="badge">แนะนำ</span><b>แบบด่วน 1 นาที</b><span>กดเลือกคำตอบ 12 ข้อ ไม่ต้องพิมพ์ตัวเลข</span></button>
        <button type="button" class="mode" id="m-detail"><b>แบบละเอียด</b><span>กรอกตัวเลขจริง ได้ผลแม่นกว่า ใช้เวลา 5 นาที</span></button>
      </div>
      <div class="trust"><span>ฟรี ไม่มีค่าใช้จ่าย</span><span>ไม่ต้องสมัคร</span><span>ส่งผลให้ที่ปรึกษาเมื่อคุณกดเองเท่านั้น</span></div>
    </section>`;
    $("#m-quick").addEventListener("click", quick);
    $("#m-detail").addEventListener("click", () => detail(null));
  }

  function quick() {
    stage.innerHTML = `<div id="wz"></div>`;
    FHC.wizard($("#wz"), {
      mode: "public",
      answers: quickAnswers,
      consentText: "เข้าใจแล้วว่าเป็นการประเมินเบื้องต้นจากช่วงตัวเลขที่เลือก",
      onDone: (input, a) => { quickAnswers = a; result(input); },
      onDetail: (input, a) => { quickAnswers = a; detail(input); },
    });
    top();
  }

  function detail(prefill) {
    stage.innerHTML = `<section class="card pop" style="gap:6px"><h2 style="font-size:20px;text-align:center">กรอกตัวเลขจริง</h2><p style="text-align:center;color:var(--muted);font-size:14px">${prefill ? "เติมค่าประมาณจากที่คุณเลือกไว้แล้ว แก้ให้ตรงได้เลย" : "ตัวเลขคร่าว ๆ ก็ได้ ช่องที่ไม่รู้เว้นว่างไว้"}</p></section><div id="detail" style="margin-top:16px"></div>
      <div class="row-btns" style="margin-top:14px"><button type="button" class="btn-soft" id="to-intro">← กลับหน้าแรก</button></div>`;
    const init = prefill ? Object.assign({}, prefill, { consent: false }) : {};
    FHC.mount($("#detail"), { mode: "public", initial: init, onSubmit: (input) => result(input) });
    $("#to-intro").addEventListener("click", intro);
    top();
  }

  function result(inp) {
    const r = FHC.calculate(inp);
    const lvMsg = { good: "การเงินแข็งแรงดีมาก รักษาวินัยนี้ไว้นะ", ok: "ใช้ได้เลย ปรับอีกนิดจะดีขึ้นอีก", warn: "มีหลายจุดที่ควรเริ่มดูแล ค่อย ๆ ทำทีละข้อได้", bad: "ถึงเวลาจัดการการเงินจริงจังแล้ว เริ่มจากข้อแรกด้านล่างก่อน" };
    const tagT = { good: "ดีแล้ว", warn: "ควรปรับ", bad: "ต้องดูแล" };
    stage.innerHTML = `<div class="res">
      <section class="card score-card pop">
        <p style="color:var(--muted)">${inp.name ? esc(inp.name) + " · " : ""}คะแนนสุขภาพการเงิน</p>
        <div class="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7fa8"/><stop offset=".55" stop-color="#9f88ff"/><stop offset="1" stop-color="#3fbf9c"/></linearGradient></defs>
            <circle cx="60" cy="60" r="50" fill="none" stroke="#fbe9ee" stroke-width="12"/>
            <circle id="ring" cx="60" cy="60" r="50" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16" style="transition:stroke-dashoffset 1.2s cubic-bezier(.3,.8,.3,1)"/></svg>
          <div class="in"><b id="score-n">0</b><small>จาก 100</small></div>
        </div>
        <span class="level lv-${r.level.key}">ระดับ ${r.level.t}</span>
        <p>${lvMsg[r.level.key]}</p>
        ${inp.quick ? `<p class="est"><span>คำนวณจากช่วงตัวเลขที่เลือก</span><button type="button" class="mini" id="refine" style="border-color:var(--line)">กรอกตัวเลขจริงให้แม่นขึ้น</button></p>` : ""}
      </section>

      <section class="card pop">
        <h2 style="font-size:20px">ภาพรวม 7 ด้าน</h2>
        <div class="radar">${FHC.radarSVG(r.metrics)}</div>
        <div class="metrics">${r.metrics.map((m) => `<div class="metric ${m.status}"><div class="top"><span>${esc(m.name)}</span><span class="tag">${tagT[m.status]}</span></div><span class="v">${esc(m.value)}</span><small>เกณฑ์: ${esc(m.target)}</small></div>`).join("")}</div>
      </section>

      <section class="card pop">
        <h2 style="font-size:20px">${r.risks.length ? "3 อย่างที่ควรทำก่อน" : "ไม่พบจุดเสี่ยงสำคัญ"}</h2>
        <div class="todo">${(r.risks.length ? r.risks : ["รักษาวินัยการเงินแบบนี้ และกลับมาเช็กใหม่ทุก 6–12 เดือน"]).map((t, i) => `<div><span class="n">${i + 1}</span><span>${esc(t)}</span></div>`).join("")}</div>
        <div class="chips" id="plan-tabs"><button type="button" class="chip" data-p="d30" aria-pressed="true">30 วัน</button><button type="button" class="chip" data-p="d90" aria-pressed="false">90 วัน</button><button type="button" class="chip" data-p="d365" aria-pressed="false">1 ปี</button></div>
        <ul class="plan-list" id="plan-list">${r.plan.d30.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
      </section>

      <section class="card send-card pop">
        <h2 style="font-size:21px;text-align:center">อยากได้แผนที่ละเอียดกว่านี้ไหม</h2>
        <p style="color:var(--muted);text-align:center">ส่งผลนี้ให้ ${esc(ADVISOR.name)} ช่วยดูต่อ ฟรี ไม่มีค่าใช้จ่าย</p>
        <div id="send-sheet" ${GAS ? "" : "hidden"} style="display:grid;gap:10px">
          <label for="contact" style="font-weight:500">ช่องทางให้ติดต่อกลับ</label>
          <input class="txt" id="contact" placeholder="LINE ID หรือเบอร์โทร" autocomplete="tel">
          <input type="text" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
          <label class="wz-consent" for="send-ok"><input type="checkbox" id="send-ok"><span>ยินยอมส่งผลประเมินและช่องทางติดต่อนี้ให้ที่ปรึกษา เพื่อติดต่อกลับเรื่องการวางแผนการเงิน</span></label>
          <button type="button" class="btn-send" id="send-btn">ส่งให้ที่ปรึกษา</button>
          <p class="or">หรือ</p>
        </div>
        <button type="button" class="btn-line" id="send-line"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M12 3C6.5 3 2 6.6 2 11c0 3.9 3.5 7.2 8.3 7.9.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.9-3.5 8.1-6C21.3 14.3 22 12.7 22 11c0-4.4-4.5-8-10-8z"/></svg>ส่งผลทาง LINE</button>
        <div class="lineid">LINE ID <b>${esc(ADVISOR.lineId)}</b><button type="button" class="mini" id="copy-id">คัดลอก</button><a class="mini" href="${ADVISOR.lineAdd}" target="_blank" rel="noopener">เพิ่มเพื่อน</a></div>
      </section>

      <div class="row-btns"><button type="button" class="btn-soft" id="copy-res">คัดลอกผล</button><button type="button" class="btn-soft" id="restart">เริ่มใหม่</button></div>
    </div>`;
    top();
    const ring = $("#ring"), n = $("#score-n");
    requestAnimationFrame(() => requestAnimationFrame(() => ring.setAttribute("stroke-dashoffset", String(314.16 * (1 - r.score / 100)))));
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) n.textContent = r.score;
    else { const t0 = performance.now(); (function tick(t) { const p = Math.min(1, Math.max(0, (t - t0) / 1100)); n.textContent = Math.round(r.score * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); })(t0); }
    $("#plan-tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-p]"); if (!b) return; $("#plan-tabs").querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === b))); $("#plan-list").innerHTML = (r.plan[b.dataset.p] || []).map((t) => `<li>${esc(t)}</li>`).join("") || "<li>รักษาแผนเดิม</li>"; });
    const summary = () => FHC.lineSummary(inp, r, { footer: "ส่งจากหน้าเช็กสุขภาพการเงิน อยากให้ช่วยดูรายละเอียดเพิ่ม" });
    $("#send-line").addEventListener("click", () => window.open("https://line.me/R/share?text=" + encodeURIComponent(summary()), "_blank", "noopener"));
    $("#copy-id").addEventListener("click", () => copy(ADVISOR.lineId, "คัดลอก LINE ID แล้ว"));
    $("#copy-res").addEventListener("click", () => copy(summary(), "คัดลอกผลแล้ว"));
    $("#restart").addEventListener("click", () => { quickAnswers = {}; intro(); top(); });
    const rf = $("#refine"); if (rf) rf.addEventListener("click", () => detail(inp));
    if (GAS) $("#send-btn").addEventListener("click", () => sendToSheet(inp, r));
  }

  function sendToSheet(inp, r) {
    const contact = $("#contact").value.trim(), ok = $("#send-ok").checked, btn = $("#send-btn");
    if (!contact) { toast("ใส่ LINE ID หรือเบอร์โทรก่อนนะ"); $("#contact").focus(); return; }
    if (!ok) { toast("ติ๊กยินยอมก่อนส่งนะ"); return; }
    btn.disabled = true; btn.textContent = "กำลังส่ง…";
    // ชื่อจุดอ่อนให้ตรงกับแดชบอร์ดใน HQ
    const WEAK = { ef: "เงินสำรองฉุกเฉิน", dsr: "ภาระหนี้สูง", cons: "หนี้ดอกเบี้ยสูง", save: "การออม", da: "หนี้สินเกินทรัพย์สิน", life: "ประกันชีวิต", health: "ประกันสุขภาพ" };
    const weak = r.metrics.filter((m) => m.status !== "good").map((m) => WEAK[m.id] || m.short);
    if (r.totals && r.totals.cashflow < 0) weak.push("เงินเหลือน้อย");
    const payload = {
      action: "lead", hp: $("#hp").value,
      name: inp.name || "", contact, consent: true, mode: inp.quick ? "ด่วน" : "ละเอียด",
      score: r.score, goal: inp.goal || "",
      income: inp.income ? FHC.fmt(inp.income) + " บาท" : "",
      dependents: (inp.dependents || 0) + " คน",
      incomeType: inp.freelance ? "ไม่แน่นอน/ฟรีแลนซ์" : "ประจำ",
      weak,
    };
    const fail = (msg) => { btn.disabled = false; btn.textContent = "ส่งให้ที่ปรึกษา"; toast(msg || "ส่งไม่สำเร็จ ลองอีกครั้ง หรือส่งทาง LINE แทน"); };
    fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
      .then((res) => res.json())
      .then((j) => {
        if (!j.ok) return fail(j.error);
        $("#send-sheet").innerHTML = `<p class="sent">ส่งแล้ว ที่ปรึกษาจะติดต่อกลับเร็ว ๆ นี้</p><p class="or">หรือ</p>`;
        toast("ส่งเรียบร้อย");
      })
      .catch(() => fail());
  }

  intro();
})();
</script>
</body>
</html>
